services:
  postgres:
    image: postgres:16
    container_name: retentionops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retentionops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retentionops}
      POSTGRES_DB: ${POSTGRES_DB:-retentionops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retentionops} -d ${POSTGRES_DB:-retentionops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: retentionops-mlflow
    working_dir: /app
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////var/lib/mlflow/mlflow.db}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-file:///var/lib/mlflow/mlruns}
      --allowed-hosts localhost:5000,127.0.0.1:5000,localhost,127.0.0.1,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - mlflow_data:/var/lib/mlflow
    environment:
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: retentionops-api
    working_dir: /app
    command: >
      uvicorn src.serving.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - mlflow_data:/var/lib/mlflow
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      UPLIFT_MODEL_NAME: ${UPLIFT_MODEL_NAME:-uplift_model}
      UPLIFT_MODEL_ALIAS: ${UPLIFT_MODEL_ALIAS:-champion}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://retentionops:retentionops@postgres:5432/retentionops}
      ENABLE_DECISION_LOGGING: ${ENABLE_DECISION_LOGGING:-true}
      POLICY_STORE_ENABLED: ${POLICY_STORE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: retentionops-jobs
    working_dir: /app
    command: bash
    profiles:
      - jobs
    volumes:
      - .:/app
      - mlflow_data:/var/lib/mlflow
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      UPLIFT_MODEL_NAME: ${UPLIFT_MODEL_NAME:-uplift_model}
      UPLIFT_MODEL_ALIAS: ${UPLIFT_MODEL_ALIAS:-champion}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://retentionops:retentionops@postgres:5432/retentionops}
      ENABLE_DECISION_LOGGING: ${ENABLE_DECISION_LOGGING:-true}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  ops:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: retentionops-ops
    working_dir: /app
    command: >
      uvicorn src.ops.main:app
      --host 0.0.0.0
      --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - mlflow_data:/var/lib/mlflow
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-local}
      API_INTERNAL_URL: http://api:8000
      MLFLOW_INTERNAL_URL: http://mlflow:5000
      PROMETHEUS_INTERNAL_URL: http://prometheus:9090
      GRAFANA_INTERNAL_URL: http://grafana:3000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5000}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3001}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://retentionops:retentionops@postgres:5432/retentionops}
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
      OPS_JOB_TIMEOUT_SECONDS: ${OPS_JOB_TIMEOUT_SECONDS:-3600}
      POLICY_STORE_ENABLED: ${POLICY_STORE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: retentionops-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      OPS_INTERNAL_URL: http://ops:8001
      API_INTERNAL_URL: http://api:8000
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
    depends_on:
      ops:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: retentionops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: retentionops-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mlflow_data:
  postgres_data:
  grafana_data:
